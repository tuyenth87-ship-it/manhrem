<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />
  <rect x="42" y="42" width="428" height="428" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4" />

  <!-- Center Emblem Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Curtain / Fabric Crown Motif -->
    <path d="M 180 150 C 210 130, 302 130, 332 150 C 350 162, 330 180, 256 175 C 182 180, 162 162, 180 150 Z" fill="url(#goldGrad)" />
    
    <!-- Stylized Monogram TH -->
    <!-- Letter T -->
    <path d="M 160 190 L 352 190 C 358 190, 362 194, 362 200 L 362 216 C 362 222, 358 226, 352 226 L 274 226 L 274 360 C 274 366, 270 370, 264 370 L 248 370 C 242 370, 238 366, 238 360 L 238 226 L 160 226 C 154 226, 150 222, 150 216 L 150 200 C 150 194, 154 190, 160 190 Z" fill="url(#goldGrad)" />
    
    <!-- Elegant Ribbon Curves -->
    <path d="M 200 270 Q 256 310 312 270 Q 256 340 200 270 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="256" y="425" text-anchor="middle" font-family="'Playfair Display', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" letter-spacing="4">TUYẾN HOA</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E7E5E4" letter-spacing="3" opacity="0.9">MÀNH RÈM · ĐỆM CHỢ CHÁY</text>
</svg>
