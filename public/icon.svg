<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="210" r="135" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.75" />

  <!-- Avatar Medallion Outer Ring -->
  <circle cx="256" cy="210" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="7" filter="url(#shadow)" />
  <circle cx="256" cy="210" r="138" fill="#FFFFFF" />
  
  <!-- Owner Photo in Circular Mask -->
  <g clip-path="url(#circleClip)">
    <image href="/assets/aistudio/20261017_162136_c08f9065.jpg" x="76" y="30" width="360" height="360" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Golden Ring Inner Border -->
  <circle cx="256" cy="210" r="135" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Verified Badge -->
  <g transform="translate(350, 290)">
    <circle cx="0" cy="0" r="20" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    <path d="M -7 0 L -2 6 L 8 -5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Golden Typography Banner Ribbon -->
  <g filter="url(#shadow)">
    <rect x="76" y="365" width="360" height="46" rx="23" fill="#0C0A09" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="256" y="398" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="27" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">TUYẾN HOA</text>
  </g>

  <!-- Tagline Subtitle -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" letter-spacing="4">RÈM • CHĂN • ĐỆM</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#A8A29E" letter-spacing="2">CHỢ CHÁY · ỨNG HÒA · HÀ NỘI</text>
</svg>
